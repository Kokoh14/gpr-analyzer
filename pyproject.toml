[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpr-analyzer"
version = "0.1.0"
description = "Automatic GPR (ground-penetrating radar) processing, anomaly detection and reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
# local upload/review screen: gpr-analyzer-app
app = ["fastapi>=0.110", "uvicorn>=0.23", "python-multipart>=0.0.9"]

[project.scripts]
gpr-sniff = "gpr_analyzer.io.sniff:main"
gpr-analyzer-app = "gpr_analyzer.app:main"

[tool.setuptools.package-data]
"gpr_analyzer.app" = ["static/*"]

[tool.setuptools.packages.find]
include = ["gpr_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
